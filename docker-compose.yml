version: "3.8"

services:
  b2b-accelerator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nocountry-b2b-accelerator
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # Opcional: configurar GITHUB_TOKEN para 5000 reqs/hora en vez de 60
      # - GITHUB_TOKEN=ghp_tu_token_aqui
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/stats')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
